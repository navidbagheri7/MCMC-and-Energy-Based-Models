name: Scientific checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-reference.txt
      - run: python -m pip install -e '.[dev,notebooks]'
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: python -m pytest -q
      - run: python scripts/validate_release.py
      - run: python scripts/review_components.py
      - run: python scripts/execute_notebooks.py
      - run: sampling-lab sampling --quick --filter '"target": "gaussian"'
      - run: python -m build
      - run: python scripts/check_distribution.py --dist dist
