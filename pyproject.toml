[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampling-energy-lab"
version = "1.0.0"
description = "An evaluated laboratory for Monte Carlo, Bayesian inference and energy-based learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Navid Bagheri-Shouraki"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<2", "scipy>=1.13,<2", "matplotlib>=3.7", "scikit-learn>=1.7,<2", "torch>=2.4,<3", "arviz>=0.21,<0.22", "pyro-ppl==1.9.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]
notebooks = ["nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "jupyterlab>=4"]

[project.scripts]
sampling-lab = "sampling_lab.cli:main"

[project.urls]
Repository = "https://github.com/navidbagheri7/sampling-energy-lab"
Documentation = "https://github.com/navidbagheri7/sampling-energy-lab#readme"
Demo = "https://navidbagheri7.github.io/sampling-energy-lab/"
Issues = "https://github.com/navidbagheri7/sampling-energy-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sampling_lab = ["default_configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".local", "legacy", "build", "assets"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
